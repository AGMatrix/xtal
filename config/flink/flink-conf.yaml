# ── JobManager ────────────────────────────────────────────────────────────────
jobmanager.rpc.address: jobmanager
jobmanager.memory.process.size: 1600m

# ── TaskManager ───────────────────────────────────────────────────────────────
taskmanager.memory.process.size: 2g
taskmanager.numberOfTaskSlots: 2

# ── Parallelism ───────────────────────────────────────────────────────────────
parallelism.default: 2

# ── Checkpointing ─────────────────────────────────────────────────────────────
execution.checkpointing.interval: 5000          # ms; XTAL controller will tune this
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.timeout: 60000
execution.checkpointing.max-concurrent-checkpoints: 1
execution.checkpointing.min-pause: 500
state.backend: rocksdb
state.backend.rocksdb.memory.managed: true
state.checkpoints.dir: file:///tmp/flink-checkpoints
state.savepoints.dir: file:///tmp/flink-savepoints

# ── Network / Backpressure ────────────────────────────────────────────────────
taskmanager.network.memory.fraction: 0.1
taskmanager.network.memory.min: 64mb
taskmanager.network.memory.max: 1gb
taskmanager.network.detailed-metrics: true      # exposes per-channel buffer metrics

# ── Metrics: Prometheus pull-based reporter ───────────────────────────────────
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249

# Latency tracking (operator-level p50/p95/p99 histograms)
metrics.latency.interval: 1000                  # ms between latency marker emissions
metrics.latency.granularity: operator           # operator | subtask

# Extra system resource metrics
metrics.system-resource: true
metrics.system-resource-probing-interval: 5000

# ── REST API ──────────────────────────────────────────────────────────────────
rest.port: 8081
rest.flamegraph.enabled: true

# ── Logging ───────────────────────────────────────────────────────────────────
env.log.level: INFO
